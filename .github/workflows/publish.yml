name: publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
      - run: npm ci
      - name: Skip if this version is already published
        id: gate
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@agentage/store-core@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "@agentage/store-core@${VERSION} already published - skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to GitHub Packages
        if: steps.gate.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # A concurrent run (dispatch + push double-fire) can win the race after our
        # gate check; if the version exists afterwards, that IS success.
        run: |
          if ! npm publish; then
            VERSION=$(node -p "require('./package.json').version")
            npm view "@agentage/store-core@${VERSION}" version >/dev/null 2>&1 \
              && echo "published by a concurrent run - ok" || exit 1
          fi
