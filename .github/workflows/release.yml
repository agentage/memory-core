name: publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # contents: write is scoped to this job only - it pushes the tag and cuts the release.
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Preflight - provenance needs a public repo, publish needs a token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ "${{ github.event.repository.private }}" = "false" ] || {
            echo "::error::npm rejects --provenance from a private repo - make this repo public first"
            exit 1
          }
          [ -n "$NPM_TOKEN" ] || { echo "::error::NPM_TOKEN secret is missing"; exit 1; }
      - name: Skip if this version is already published
        id: gate
        run: |
          SPEC="$(node -p "const p=require('./package.json');p.name+'@'+p.version")"
          TAG="v$(node -p "require('./package.json').version")"
          echo "spec=${SPEC}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${SPEC} already published - skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.gate.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A concurrent run (dispatch + push double-fire) can win the race after the gate; that IS success.
        run: |
          if ! npm publish --access public --provenance; then
            npm view "${{ steps.gate.outputs.spec }}" version >/dev/null 2>&1 \
              && echo "published by a concurrent run - ok" || exit 1
          fi

      # Both steps below are idempotent, so re-running the workflow repairs a partial
      # failure (npm published but the tag or the GitHub release was stranded).
      - name: Tag the release
        if: steps.gate.outputs.exists == 'false'
        run: |
          TAG="${{ steps.gate.outputs.tag }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/${TAG}")" ]; then
            echo "tag ${TAG} already on origin"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
      - name: Create the GitHub release
        if: steps.gate.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.gate.outputs.tag }}"
          gh release view "$TAG" >/dev/null 2>&1 && { echo "release $TAG exists"; exit 0; }
          gh release create "$TAG" --title "$TAG" --generate-notes
