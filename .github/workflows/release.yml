name: publish

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: [package.json]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Preflight - provenance needs a public repo, publish needs a token
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          [ "${{ github.event.repository.private }}" = "false" ] || {
            echo "::error::npm rejects --provenance from a private repo - make this repo public first"
            exit 1
          }
          [ -n "$NPM_TOKEN" ] || { echo "::error::NPM_TOKEN secret is missing"; exit 1; }
      - name: Skip if this version is already published
        id: gate
        run: |
          SPEC="$(node -p "const p=require('./package.json');p.name+'@'+p.version")"
          echo "spec=${SPEC}" >> "$GITHUB_OUTPUT"
          if npm view "${SPEC}" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${SPEC} already published - skipping"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to npm
        if: steps.gate.outputs.exists == 'false'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        # A concurrent run (dispatch + push double-fire) can win the race after the gate; that IS success.
        run: |
          if ! npm publish --access public --provenance; then
            npm view "${{ steps.gate.outputs.spec }}" version >/dev/null 2>&1 \
              && echo "published by a concurrent run - ok" || exit 1
          fi
