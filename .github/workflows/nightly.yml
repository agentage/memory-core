name: nightly

on:
  schedule:
    # Off the top of the hour: the estate staggers scheduled runs by 10min offsets.
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deep-verify:
    runs-on: ubuntu-latest
    env:
      PERF_SCALE: '5000'
      FUZZ_RUNS: '500'
      FUZZ_DIFF_RUNS: '25'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
